appId: cloud.skylyer.desktop
productName: Skylyer
directories:
  output: release
files:
  - out/**/*
# Copied as loose files (not packed into the asar) into the installed app's
# resources/ folder — Explorer's sync-root icon and the tray icon both need
# a real on-disk path to load from at runtime, not something inside the
# archive; .env ships the same way so SKYLYER_API_URL can be edited after
# install (resources/.env) without rebuilding.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: .env
    to: .env
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
