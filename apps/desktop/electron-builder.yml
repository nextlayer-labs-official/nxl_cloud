appId: cloud.skylyer.desktop
productName: Skylyer
directories:
  output: release
files:
  - out/**/*
# Copied as loose files (not packed into the asar) into the installed app's
# resources/ folder — Explorer's sync-root icon and the tray icon both need
# a real on-disk path to load from at runtime, not something inside the archive.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
